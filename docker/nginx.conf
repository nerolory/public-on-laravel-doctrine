map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    # Встроенный DNS Docker: адреса контейнеров берутся заново после их пересоздания, перезапуск nginx не нужен.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:3000;
    set $php app:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location = /admin { try_files $uri /index.php?$query_string; }
    location ^~ /admin/ { try_files $uri /index.php?$query_string; }
    location = /api { try_files $uri /index.php?$query_string; }
    # robots.txt, карту сайта и RSS строит Laravel по настройкам.
    location = /robots.txt { try_files $uri /index.php?$query_string; }
    location = /sitemap.xml { try_files $uri /index.php?$query_string; }
    location = /rss.xml { try_files $uri /index.php?$query_string; }
    location ^~ /api/ { try_files $uri /index.php?$query_string; }
    location ^~ /vendor/ { try_files $uri =404; }
    location ^~ /build/ { try_files $uri =404; }
    location ^~ /media/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    # Ресурсы Nuxt и Vite, включая node_modules/.cache, не должны попадать под запрет путей с точкой.
    location ^~ /_nuxt/ { proxy_pass $frontend; }
    location / { proxy_pass $frontend; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
